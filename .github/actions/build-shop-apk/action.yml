name: "Build one shop's white-label APK"
description: >
  Derives a unique Android application id from shop_id, regenerates the
  launcher icon from logo_url, builds a release APK with system-level
  branding, and publishes it to a per-shop GitHub Release.

inputs:
  shop_id:
    required: true
  app_name:
    required: true
  primary_color:
    required: false
    default: "2E7D32"
  secondary_color:
    required: false
    default: ""
  logo_url:
    required: false
    default: ""
  github_token:
    required: true
  api_base_url:
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - uses: actions/setup-java@v4
      with:
        distribution: "temurin"
        java-version: "17"
        # Flutter 3.24's bundled Gradle/Groovy scripts (flutter.groovy)
        # don't compile under the JDK 21 that ubuntu-latest now ships by
        # default ("unable to resolve class groovy.xml.QName") -- pin to
        # 17, which is what this Flutter/Gradle combo actually supports,
        # before the Flutter toolchain step below picks up whatever JDK
        # is already on PATH.

    - uses: subosito/flutter-action@v2
      with:
        channel: stable
        # No flutter-version pin: Flutter 3.24's own internal build
        # tooling (flutter_tools/gradle/.../flutter.groovy) fails to
        # compile under the Gradle/JDK combination GitHub's runners now
        # ship ("unable to resolve class groovy.xml.QName") -- this was
        # a bug in Flutter's tooling itself, fixed in later stable
        # releases. Pinning JDK 17 above doesn't work around it because
        # the failure is in Flutter's bundled Groovy script, not
        # anything version-controlled by this project. Always building
        # against current stable avoids re-hitting this.

    - name: Derive a unique Android application id
      id: app_id
      shell: bash
      run: |
        # Android application ids must be dot-separated Java identifiers
        # (letters/digits/underscore, each segment starting with a
        # letter) -- a raw UUID doesn't qualify, so take its first 8 hex
        # characters and prefix with a letter. This has to be
        # DETERMINISTIC (same shop_id -> same id every rebuild): a
        # shop's app id must stay stable across "Generate My App"
        # re-runs, or a customer re-downloading an "update" would
        # actually get flagged by Android as a different, unrelated app
        # and fail to install over the old one.
        RAW="${{ inputs.shop_id }}"
        SHORT=$(echo "$RAW" | tr -d '-' | cut -c1-8 | tr '[:upper:]' '[:lower:]')
        APP_ID="com.kiranamandi.shop.s${SHORT}"
        echo "app_id=$APP_ID" >> "$GITHUB_OUTPUT"
        echo "Derived application id: $APP_ID"

    - name: Install dependencies
      shell: bash
      working-directory: kirana_marketplace
      run: flutter pub get

    - name: Download shop logo for the launcher icon
      if: inputs.logo_url != ''
      id: logo
      shell: bash
      working-directory: kirana_marketplace
      run: |
        mkdir -p assets/icon
        RAW="$RUNNER_TEMP/shop_logo_raw"
        if ! curl -sSL --fail "${{ inputs.logo_url }}" -o "$RAW"; then
          echo "::warning::Could not download logo_url, keeping the default icon."
          echo "ok=false" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        # curl succeeding only means we got SOME response with a 2xx
        # status -- it says nothing about whether that response is an
        # actual, decodable image (a redirect landing page, an
        # unsupported format like webp/avif, or a corrupt file all pass
        # curl --fail just fine and then crash
        # flutter_launcher_icons/Skia deep inside the next step).
        # ImageMagick (preinstalled on GitHub's ubuntu-latest runners)
        # re-encodes whatever it is into a clean, flattened, correctly
        # sized PNG, or fails clearly right here instead.
        if convert "$RAW" -resize 1024x1024 -background white -flatten assets/icon/icon.png; then
          echo "ok=true" >> "$GITHUB_OUTPUT"
        else
          echo "::warning::logo_url didn't decode as an image, keeping the default icon."
          rm -f assets/icon/icon.png
          echo "ok=false" >> "$GITHUB_OUTPUT"
        fi

    - name: Regenerate the Android launcher icon from the shop's logo
      if: inputs.logo_url != '' && steps.logo.outputs.ok == 'true'
      shell: bash
      working-directory: kirana_marketplace
      run: dart run flutter_launcher_icons

    - name: Build release APK (split per ABI)
      shell: bash
      working-directory: kirana_marketplace
      run: |
        flutter build apk \
          --release \
          --split-per-abi \
          -PshopAppId=${{ steps.app_id.outputs.app_id }} \
          -PshopAppLabel="${{ inputs.app_name }}" \
          --dart-define=API_BASE_URL=${{ inputs.api_base_url }} \
          --dart-define=SHOP_ID=${{ inputs.shop_id }} \
          --dart-define=APP_NAME="${{ inputs.app_name }}" \
          --dart-define=PRIMARY_COLOR=${{ inputs.primary_color }} \
          --dart-define=SECONDARY_COLOR=${{ inputs.secondary_color }}

    - name: Publish / update this shop's release
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.github_token }}
      run: |
        TAG="shop-${{ inputs.shop_id }}"
        # Overwrite the previous build for this shop rather than
        # accumulating one release per run, so the shopkeeper's
        # shared download link never changes.
        gh release delete "$TAG" --yes --cleanup-tag 2>/dev/null || true
        gh release create "$TAG" \
          --title "${{ inputs.app_name }}" \
          --notes "Auto-built white-label APK for shop ${{ inputs.shop_id }}. Application id: ${{ steps.app_id.outputs.app_id }}." \
          kirana_marketplace/build/app/outputs/flutter-apk/*-release.apk

    - name: Summary
      shell: bash
      run: |
        echo "### ${{ inputs.app_name }}" >> "$GITHUB_STEP_SUMMARY"
        echo "- Application id: \`${{ steps.app_id.outputs.app_id }}\`" >> "$GITHUB_STEP_SUMMARY"
        echo "- Download: https://github.com/${{ github.repository }}/releases/tag/shop-${{ inputs.shop_id }}" >> "$GITHUB_STEP_SUMMARY"