name: kirana_mandi
description: Kirana Mandi - a Flutter marketplace app connecting customers with local kirana stores and neighborhood shops.
publish_to: 'none'
version: 0.2.0

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.6

  # State management
  provider: ^6.1.2

  # Local (development/offline-cache) database
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Session persistence & lightweight local key-value cache
  shared_preferences: ^2.3.2

  # Offline / connectivity detection
  connectivity_plus: ^6.0.5

  # Networking (textbee.dev OTP SMS gateway)
  http: ^1.2.2

  # Charts for shopkeeper analytics (daily/weekly/monthly revenue)
  fl_chart: ^0.69.0

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  url_launcher: ^6.3.0

  # Optional device location for "use current location" on shop setup.
  # Safe to remove if you don't want the extra native permission setup.
  geolocator: ^12.0.0

  # Caches decoded shop logo/banner images in memory + on disk instead
  # of re-downloading and re-decoding them on every rebuild -- see
  # core/widgets/shop_logo.dart, used anywhere a shop's branding image
  # is shown (splash, single-shop home, shop profile).
  cached_network_image: ^3.4.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

  # Regenerates android/app/src/main/res/mipmap-*/ic_launcher.png (and,
  # if ios/ is present, the iOS AppIcon set) from a single source image
  # at build time -- this is what changes the launcher icon at the
  # SYSTEM level for a shop-specific white-label build. Run manually via
  # `flutter pub run flutter_launcher_icons` after placing a shop's logo
  # at the path below, or let CI do it (see
  # .github/workflows/build_apk.yml, which downloads the shop's
  # logo_url to this exact path before building).
  flutter_launcher_icons: ^0.14.1

flutter:
  uses-material-design: true

# See the dev_dependency comment above -- CI overwrites
# assets/icon/icon.png per shop before running this. Locally, drop your
# own 1024x1024 PNG there and run `flutter pub run flutter_launcher_icons`
# to preview a shop's icon on a device/emulator.
flutter_launcher_icons:
  android: true
  image_path: "assets/icon/icon.png"
  min_sdk_android: 21
